name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Validate registry
        run: bun run check:registry

      - name: Build UI package
        run: bun run build:ui

      - name: Build CLI
        run: bun run build:cli

      - name: Smoke-test package exports
        run: bun run smoke:package

      - name: Consumer test against packed tarballs
        run: bun run test:consumer

      - name: Build documentation site
        run: bun run --filter @aback-ui/website build
