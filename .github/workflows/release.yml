name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Trusted publishing (OIDC) needs Node 22.14+ and npm 11.5.1+.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Validate registry
        run: bun run check:registry

      - name: Build UI package
        run: bun run build:ui

      - name: Build CLI with the bundled registry
        run: bun run build:cli

      - name: Smoke-test package exports
        run: bun run smoke:package

      - name: Consumer test against packed tarballs
        run: bun run test:consumer

      - name: Build documentation site
        run: bun run --filter @aback-ui/website build

      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in packages/ui packages/tokens packages/cli; do
            VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$VERSION" != "$TAG" ]; then
              echo "Tag v$TAG does not match $pkg version $VERSION" >&2
              exit 1
            fi
          done

      # npm authenticates each publish through the trusted publisher set up
      # for the package on npmjs.com; no npm token is stored in the repository.
      - name: Publish tokens
        run: npm publish --access public
        working-directory: packages/tokens

      - name: Publish UI
        run: npm publish --access public
        working-directory: packages/ui

      - name: Publish CLI
        run: npm publish --access public
        working-directory: packages/cli
